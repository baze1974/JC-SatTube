name: Criar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Baixar ferramentas de vídeo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin/windows" | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "bin/windows/yt-dlp.exe"

          $zip = "$env:RUNNER_TEMP/ffmpeg.zip"
          $dest = "$env:RUNNER_TEMP/ffmpeg"

          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $ffmpeg = Get-ChildItem -Path $dest -Filter "ffmpeg.exe" -Recurse |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw "Não foi possível encontrar ffmpeg.exe"
          }

          Copy-Item $ffmpeg.FullName "bin/windows/ffmpeg.exe" -Force

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador Windows
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: JC-SATube-Instalador-Windows
          path: dist/JC-SATube-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
